<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Battery System A - Setup</title><style>body{font:16px system-ui;background:#101827;color:#e5edf7;margin:0;padding:32px}main{max-width:760px;margin:auto}section{background:#1e293b;padding:24px;border-radius:12px;margin:16px 0}h1{color:#60a5fa}input,select,button{font:inherit;padding:10px;border-radius:6px;border:1px solid #64748b;margin:6px 0;max-width:100%;box-sizing:border-box}input,select{width:100%;background:#101827;color:white}button{background:#2563eb;color:white;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#a7d9ff}label{display:block}button:disabled{opacity:.5}</style><main><h1>Battery System A</h1><p>ESP32-S3 · USB 本地管理 · 联网验证版</p><section><h2>Wi-Fi 网络配置</h2><p id="status">正在读取设备状态…</p><button id="scan">扫描无线网络</button><select id="nets"><option value="">选择网络</option></select><label>Wi-Fi 名称<input id="ssid" maxlength="32" autocomplete="off"></label><label>密码<input id="pw" type="password" maxlength="63" autocomplete="off"></label><button id="connect">保存并连接</button><pre id="log"></pre></section><section><h2>GitHub 更新检测</h2><p>仅检测更新清单，尚不安装网页或固件。</p><button id="check">检查 GitHub</button><pre id="result"></pre></section></main><script>const $=id=>document.getElementById(id);async function req(url,opts){const r=await fetch(url,{cache:'no-store',...opts});const t=await r.text();if(!r.ok)throw Error(t);return t}async function status(){try{const j=JSON.parse(await req('/api/wifi/status'));$('status').textContent=j.connected?'已连接 '+j.ssid+' · '+j.ip:'尚未取得 Wi-Fi IP 地址'}catch(e){$('status').textContent='状态读取失败'}}$('nets').onchange=()=>{$('ssid').value=$('nets').value};async function run(button,output,fn){button.disabled=true;try{await fn()}catch(e){output.textContent=e.message}finally{button.disabled=false}}$('scan').onclick=()=>run($('scan'),$('log'),async()=>{const a=JSON.parse(await req('/api/wifi/scan'));$('nets').replaceChildren(new Option('选择网络',''));for(const n of a){if(n.ssid)$('nets').add(new Option(n.ssid+' ('+n.rssi+' dBm)',n.ssid))}$('log').textContent='扫描完成'});$('connect').onclick=()=>run($('connect'),$('log'),async()=>{const data={ssid:$('ssid').value,password:$('pw').value};await req('/api/wifi/connect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});$('pw').value='';$('log').textContent='已提交连接请求，等待获取 IP';await status()});$('check').onclick=()=>run($('check'),$('result'),async()=>{const j=JSON.parse(await req('/api/update/check'));$('result').textContent=JSON.stringify(j,null,2)});status();setInterval(status,5000);</script></html>
