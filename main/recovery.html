<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>系统 A · 恢复与配置</title><style>body{font:16px "Microsoft YaHei",sans-serif;background:#eef1ed;color:#172b2a;margin:0;padding:32px}main{max-width:820px;margin:auto}section{background:white;border:1px solid #bcc9c3;padding:24px;margin:20px 0}label{display:block;margin:12px 0}input,select,button{font:inherit;padding:10px;max-width:100%;box-sizing:border-box}input,select{width:100%}button{background:#16584f;color:white;border:0;cursor:pointer;margin:5px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}small{color:#4d635c}</style></head><body><main><small>BATTERY SYSTEM A / 内置恢复入口</small><h1>本地连接始终可用</h1><p>此页面保存在固件中。网页更新不会覆盖它。所有管理操作仅接受 USB 直连和管理员认证。</p><section><h2>管理员登录</h2><label>本机生成的管理员密码<input id="admin" type="password" autocomplete="current-password"></label><button id="login">登录</button><p id="session">尚未登录</p></section><section><h2>ESP32 独立 Wi-Fi</h2><button id="scan">扫描 2.4 GHz 网络</button><select id="nets"><option value="">选择网络或手动输入</option></select><label>SSID<input id="ssid" maxlength="32"></label><label>Wi-Fi 密码<input id="password" type="password" maxlength="63"></label><button id="connect">连接并在成功后保存</button><button id="disconnect">断开</button><pre id="wifi"></pre></section><section><h2>签名更新</h2><button id="check">检查 GitHub</button><button id="install">安装已验证网页</button><button id="rollback">恢复上一网页</button><p>固件自动安装默认关闭；实验进行时延迟更新。</p><pre id="update"></pre></section><pre id="log" role="status"></pre></main><script>'use strict';let csrf='';const $=id=>document.getElementById(id);async function request(url,data){const r=await fetch(url,{cache:'no-store',credentials:'same-origin',method:data===undefined?'GET':'POST',headers:data===undefined?{}:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:data===undefined?undefined:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw Error(j.message||r.status);return j}async function run(fn){try{await fn();$('log').textContent='请求已处理，请检查真实设备状态。'}catch(e){$('log').textContent=e.message}}$('login').onclick=()=>run(async()=>{const j=await request('/api/session',{password:$('admin').value});csrf=j.csrf;$('admin').value='';$('session').textContent='USB 管理员已登录'});$('scan').onclick=()=>run(()=>request('/api/wifi/scan',{}));$('nets').onchange=()=>{$('ssid').value=$('nets').value};$('connect').onclick=()=>run(async()=>{await request('/api/wifi/connect',{ssid:$('ssid').value,password:$('password').value});$('password').value=''});$('disconnect').onclick=()=>run(()=>request('/api/wifi/disconnect',{}));$('check').onclick=()=>run(()=>request('/api/update/check',{}));$('install').onclick=()=>run(()=>request('/api/update/install',{kind:'ui'}));$('rollback').onclick=()=>run(()=>request('/api/web/rollback',{}));async function poll(){try{const w=await request('/api/wifi/status');$('wifi').textContent=JSON.stringify(w,null,2);const selected=$('nets').value;$('nets').replaceChildren(new Option('选择网络或手动输入',''));for(const ap of w.networks||[])$('nets').add(new Option(ap.ssid+' · '+ap.rssi+' dBm',ap.ssid));$('nets').value=selected;$('update').textContent=JSON.stringify(await request('/api/update/status'),null,2)}catch(e){$('log').textContent=e.message}setTimeout(poll,4000)}poll();</script></body></html>
