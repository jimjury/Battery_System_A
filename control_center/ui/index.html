<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AB 通信中心 C</title><link rel="stylesheet" href="/admin.css"><script src="/admin.js" defer></script></head><body><main><p class="eyebrow">AB / INDEPENDENT COMMUNICATION CENTER</p><h1>通信中心 C</h1><p>身份、逐对授权与任务数据由此服务管理。模型在 B 执行。</p><section><h2>管理员登录</h2><form id="login"><label>管理员口令<input id="password" type="password" autocomplete="current-password" required></label><button>登录</button></form><p id="status">等待登录</p></section><section id="admin" hidden><div class="grid"><article><h2>签发一次性登记码</h2><form id="enroll"><label>角色<select id="role"><option>A</option><option>B</option></select></label><button>签发五分钟有效码</button></form><pre id="code"></pre><p>登记码只交给对应角色的设备，不是 A-B 配对码。</p></article><article><h2>实际运行统计</h2><button id="refresh">刷新</button><pre id="counts"></pre></article></div><h2>已登记节点</h2><div class="scroll"><table id="nodes"></table></div></section><p id="error" role="alert"></p><footer>API v1 · HTTPS 权威状态 · 无权重/模型执行</footer></main></body></html>
